syntax = "proto2";

import "confluent/meta.proto";

package example;

// proto2 tracks explicit presence for a plain `optional` scalar without the synthetic
// oneof proto3 uses, so it is the shape that tells `HasPresence` apart from
// `ContainingOneof != null`. An unset field here must not invoke the rule.
message ValidationProto2Presence {
  optional string opt = 1 [(confluent.field_meta) = {
    rules: [{name: "optRule", expr: "size(this) > 0"}]
  }];
  required string req = 2;
}
